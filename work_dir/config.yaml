dataset:
  train:
    name: kws_xiaoyunxiaoyun
    split: train
  val:
    name: kws_xiaoyunxiaoyun
    split: val
evaluation:
  dataloader:
    batch_size_per_gpu: 256
    prefetch: 2
    workers_per_gpu: 0
  metrics:
  - audio-noise-metric
framework: pytorch
model:
  backbone:
    input_affine_dim: 140
    left_order: 10
    left_stride: 1
    linear_dim: 250
    num_layers: 4
    output_affine_dim: 140
    proj_dim: 128
    right_order: 2
    right_stride: 1
    type: fsmn
  cmvn_file: /mnt/workspace/.cache/modelscope/damo/speech_charctc_kws_phone-xiaoyun/train/feature_transform.txt.80dim-l2r2
  input_dim: 400
  output_dim: 2599
  type: speech_kws_fsmn_char_ctc_nearfield
pipeline:
  type: kws-kwsbp
preprocessor:
  batch_conf:
    batch_size: 32
  context_expansion: true
  context_expansion_conf:
    left: 2
    right: 2
  feature_extraction_conf:
    dither: 1.0
    feature_type: fbank
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  filter_conf:
    max_length: 1500
    min_length: 10
  frame_skip: 3
  shuffle: true
  shuffle_conf:
    shuffle_size: 1500
  spec_aug: true
  spec_aug_conf:
    max_f: 30
    max_t: 50
    num_f_mask: 2
    num_t_mask: 2
task: keyword-spotting
train:
  dataloader:
    batch_size_per_gpu: 256
    prefetch: 2
    workers_per_gpu: 0
  hooks:
  - interval: 1
    type: EvaluationHook
  lr_scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    mode: min
    patience: 3
    threshold: 0.01
    type: ReduceLROnPlateau
    verbose: true
  lr_scheduler_hook:
    metric_key: avg_loss
    type: PlateauLrSchedulerHook
  max_epochs: 10
  optimizer:
    grad_accum: 1
    grad_clip: 5.0
    lr: 0.001
    type: Adam
    weight_decay: 0.0001
